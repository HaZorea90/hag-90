  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">

  <!-- Apply saved preferences before first paint to avoid a flash of the wrong mode/size -->
  <script>
    try {
      var d = document.documentElement;
      var t = localStorage.getItem('hz90-theme');
      var s = localStorage.getItem('hz90-size');
      if (t === 'light' || t === 'dark') d.dataset.theme = t;
      if (s === '0' || s === '1' || s === '2') d.dataset.size = s;
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

  <a class="skip-link" href="#program">דלגו לתוכנייה</a>

        <li><a href="#participants">משתתפים</a></li>

        <button type="button" class="icon-btn" id="theme-toggle" aria-label="מעבר למצב בהיר">
          <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
            <g stroke="currentColor" stroke-width="2" stroke-linecap="round">

            </g>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a.6.6 0 0 0-.8-.7A9.5 9.5 0 1 0 21.2 15.4a.6.6 0 0 0-.7-.8z"/>
          </svg>
        </button>

    </div>

    <section class="section" id="participants" aria-labelledby="participants-h" hidden>
